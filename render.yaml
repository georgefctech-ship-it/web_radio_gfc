services:
  - type: web
    name: web-radio-gfc-socket
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install
    startCommand: npx tsx server.ts
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
